// New-Old Weapons Pack — раздача файлов клиентам (FastDL).
// Подключить: в server.cfg строка  exec nowp_fastdl.cfg
//
// Впиши адрес своего GitHub Pages — тот, что печатает tools/push_fastdl.sh.
// Слэш в конце обязателен, длина — не больше 127 знаков.
sv_downloadurl "https://ВАШ_ЛОГИН.github.io/ВАШ_РЕПОЗИТОРИЙ/"

sv_allowdownload 1      // клиентам можно качать файлы сервера
sv_allowupload 0        // а заливать свои (спреи) — нет
